name: Build Router Firmware

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 重复触发时自动取消旧的构建，避免排队占用 GitHub Actions 时间
concurrency:
  group: build-firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build version
        id: version
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream master

          build_time=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')
          repo_commit=$(git rev-parse --short=10 HEAD)
          upstream_base=$(git merge-base HEAD upstream/master)
          upstream_commit=$(git rev-parse --short=10 "$upstream_base")
          version="naoki66-${build_time}-${repo_commit}-${upstream_commit}"

          echo "date=${build_time%%-*}" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Build version: $version"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      # ==== 缓存 feeds/（git clone 结果）。恢复后 feeds update 只做增量 git pull，省掉每次全量克隆。
      #      save 步骤在 job 末尾（save 的 key 带 run_id，否则 key 已存在时永远存不进去）====
      - name: Restore feeds cache
        uses: actions/cache/restore@v4
        with:
          path: feeds
          key: feeds-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            feeds-${{ runner.os }}

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp config.seed .config
          sed -i -e '/^CONFIG_VERSION_NUMBER=/d' \
                 -e '/^# CONFIG_VERSION_NUMBER is not set$/d' .config
          echo 'CONFIG_VERSION_NUMBER="${{ steps.version.outputs.version }}"' >> .config
          make defconfig

      # ==== 缓存 dl/（源码包下载结果，ccache 也放这里，见 config.seed 的 CCACHE_DIR）。
      #      即使树更新后部分包版本变了，make download 会校验 sha256 自动补下增量，所以 restore-keys 静态前缀足够。
      #      save 步骤在 job 末尾（key 带 run_id 避免与已存在的缓存冲突导致存不进去）====
      - name: Restore dl cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ runner.os }}

      - name: Download sources
        run: make download -j$(nproc)

      # ==== 缓存 staging_dir/（交叉工具链 + host 工具）。工具链编译是整个构建最耗时的一步，
      #      stamp（如 toolchain/Makefile 的 .gcc_final_installed）就存在 staging_dir 里，
      #      命中后 make 会直接跳过工具链编译。key 带 github.sha：上游同步导致工具链版本变化时
      #      自动走 restore-keys 恢复旧工具链并只重编有变化的部分。
      #      save 步骤在 job 末尾，if: always() 保证失败的构建也保存工具链 ====
      - name: Restore staging_dir cache
        uses: actions/cache/restore@v4
        with:
          path: staging_dir
          key: staging-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            staging-${{ runner.os }}-

      - name: Build Firmware
        shell: bash
        run: |
          # 2 核 runner 上 $(nproc)=2，与原来 -j2 等价；换更大 runner 会自动扩
          make -j$(nproc) world 2>&1 | tee build.log

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            tail -100 build.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: router-firmware
          path: |
            build.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      # ==== 缓存保存（即使编译失败也保存，取代已废弃的 save-always）====
      - name: Save feeds cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: feeds
          key: feeds-${{ runner.os }}-${{ github.run_id }}

      - name: Save dl cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ runner.os }}-${{ github.run_id }}

      - name: Save staging_dir cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: staging_dir
          key: staging-${{ runner.os }}-${{ github.sha }}

      - name: Build release body
        if: github.event.inputs.release_type != 'none'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            printf '%s\n' "$RELEASE_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          name: ${{ format('{0} - XR1710G Build ({1})', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
